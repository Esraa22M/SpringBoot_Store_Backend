spring:
  application:
    name: CreatorStore

  #Database information
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Hibernate ORM configuration to simplify SQL command execution
  #Hibernate is responsible for our ORM configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true